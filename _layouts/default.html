<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <!-- CSS custom -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  <style>
    /* 🌟 Encadré élégant pour les rubriques */
    .site-nav a {
      padding: 8px 12px;
      margin: 4px;
      border: 2px solid #ccc;
      border-radius: 12px;
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s;
    }

    .site-nav a:hover {
      background-color: #f0f0f0;
      color: #333;
    }

    /* 🌙 Dark mode styles */
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    body.dark-mode .site-nav a {
      border-color: #555;
    }

    body.dark-mode .site-nav a:hover {
      background-color: #333;
      color: #fff;
    }

    /* 🌗 Bouton toggle */
    #theme-toggle {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 10px;
    }

    /* 🟢 Ticker container */
    .tv-ticker-wrap {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #0b1220;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    body:not(.dark-mode) .tv-ticker-wrap {
      background: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
  </style>
</head>

<body>
  <!-- ===== Top Market Ticker (TradingView) ===== -->
  <div class="tv-ticker-wrap">
    <div class="tradingview-widget-container" style="max-width: 1600px; margin: 0 auto;">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
          { "proName": "NASDAQ:NDX",       "title": "Nasdaq 100" },
          { "proName": "DJ:DJI",           "title": "Dow Jones" },
          { "proName": "EURONEXT:PX1",     "title": "CAC 40" },
          { "proName": "XETR:DAX",         "title": "DAX" },
          { "proName": "FOREXCOM:UKXGBP",  "title": "FTSE 100" },
          { "proName": "EUREX:FESX1!",     "title": "Euro Stoxx 50 Fut" },
          { "proName": "TVC:NI225",        "title": "Nikkei 225" },
          { "proName": "TVC:VIX",          "title": "VIX" },
          { "proName": "OANDA:XAUUSD",     "title": "Gold" },
          { "proName": "TVC:UKOIL",        "title": "Brent" },
          { "proName": "CRYPTO:BTCUSD",    "title": "BTC/USD" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>
  <!-- ===== /Top Market Ticker ===== -->

  <!-- ✅ En-tête -->
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        {% assign sorted_pages = site.pages | sort: "nav_order" %}
        {% for page in sorted_pages %}
          {% if page.title and page.nav != false %}
            <a href="{{ page.url | relative_url }}">{{ page.title }}</a>
          {% endif %}
        {% endfor %}
        <!-- 🌗 Bouton toggle directement dans le menu -->
        <button id="theme-toggle" title="Toggle theme">🌙</button>
      </nav>
    </div>
  </header>

  <!-- ✅ Contenu principal -->
  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <!-- ✅ Pied de page -->
  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    </div>
  </footer>

  <!-- 🔌 Script dark mode -->
  <script>
    const toggleButton = document.getElementById('theme-toggle');
    let theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.body.classList.toggle('dark-mode', theme === 'dark');
    toggleButton.textContent = theme === 'dark' ? '☀️' : '🌙';

    toggleButton.addEventListener('click', () => {
      theme = (theme === 'dark') ? 'light' : 'dark';
      document.body.classList.toggle('dark-mode', theme === 'dark');
      toggleButton.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    });
  </script>
</body>
</html>
